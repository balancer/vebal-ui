name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Run smoke test
        run: npm run smoke -- --address 0x55031F623152CfB63c60A152238B9b3B28c568B0 --rpc "$RPC"
        env:
          RPC: ${{ secrets.FORK_RPC || 'https://ethereum-rpc.publicnode.com' }}

  e2e:
    runs-on: ubuntu-latest
    # Playwright's own image — browsers and system deps are baked in, so there is
    # no `playwright install` step. Keep the tag in lockstep with @playwright/test.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Set up foundry (includes anvil)
        uses: foundry-rs/foundry-toolchain@v1
      - name: Run e2e
        run: npm run e2e
        env:
          FORK_RPC: ${{ secrets.FORK_RPC || 'https://ethereum-rpc.publicnode.com' }}
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
